<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>熔井</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #100e0c;
    color: #f3eadf;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  body {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .wrap {
    width: min(480px, 100%);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .sub { margin: 2px 0 0; color: #b5a89a; font-size: 13px; }
  .scores { display: flex; gap: 16px; text-align: right; }
  .scores b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .scores span { color: #b5a89a; font-size: 12px; }
  canvas {
    width: 100%;
    height: auto;
    border-radius: 18px;
    background: #1a1410;
    touch-action: none;
    cursor: crosshair;
  }
  footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: #b5a89a;
    font-size: 13px;
    line-height: 1.45;
  }
  button {
    background: transparent;
    color: #f3eadf;
    border: 1px solid #5c4d42;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    font: inherit;
  }
  button:hover { border-color: #d8a15a; }
  #sim-result { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>熔井</h1>
        <p class="sub">相同的火种碰在一起，就会长成更大的一团</p>
      </div>
      <div class="scores">
        <div><b id="score">0</b><span>分数</span></div>
        <div><b id="best">0</b><span>最高</span></div>
      </div>
    </header>
    <canvas id="game" width="460" height="680"></canvas>
    <footer>
      <div>移动鼠标瞄准，单击投下。方向键移动，空格投下。火种高出红线并停住，井就灭了。</div>
      <button id="mute" type="button">声音开</button>
    </footer>
    <div id="sim-result"></div>
  </div>
<script>
const W = 460;
const H = 680;
const LEFT = 46;
const RIGHT = 414;
const BOTTOM = 636;
const LINE_Y = 148;
const DROP_Y = 86;
const BEST_KEY = "cinder-well-best";

const TIERS = [
  { name: "灰",   short: "灰", r: 18,  score: 1,    color: "#8d847b", core: "#f2ece6" },
  { name: "火星", short: "火", r: 24,  score: 3,    color: "#d4764a", core: "#ffe0c8" },
  { name: "余烬", short: "烬", r: 31,  score: 6,    color: "#e5532f", core: "#ffc7b4" },
  { name: "炭",   short: "炭", r: 39,  score: 10,   color: "#ff6a2c", core: "#ffd7bf" },
  { name: "火苗", short: "苗", r: 48,  score: 18,   color: "#ffb11a", core: "#fff3c9" },
  { name: "烈焰", short: "焰", r: 58,  score: 32,   color: "#ffe14a", core: "#fffcea" },
  { name: "流星", short: "陨", r: 70,  score: 56,   color: "#3ec0ff", core: "#e7f7ff" },
  { name: "彗星", short: "彗", r: 82,  score: 96,   color: "#3b82f6", core: "#dbeafe" },
  { name: "新星", short: "新", r: 96,  score: 168,  color: "#a78bfa", core: "#f3e8ff" },
  { name: "恒星", short: "恒", r: 110, score: 280,  color: "#f472b6", core: "#ffe4f1" },
  { name: "太阳", short: "日", r: 124, score: 480,  color: "#fff1c2", core: "#ffffff" },
];

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const simEl = document.getElementById("sim-result");

let dpr = 1;
let bodies = [];
let current = 0;
let nextTier = 0;
let aimX = (LEFT + RIGHT) / 2;
let score = 0;
let best = Number(localStorage.getItem(BEST_KEY) || 0);
let over = false;
let danger = 0;
let cooldown = 0;
let combo = 0;
let comboTimer = 0;
let shake = 0;
let drops = 0;
let popups = [];
let sparks = [];
let audioOn = true;
let audioCtx = null;
let last = 0;
let pointerX = aimX;

bestEl.textContent = String(best);

function roll() {
  return Math.floor(Math.random() * 5);
}

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
}

function make(x, y, tier) {
  const t = TIERS[tier];
  return { x, y, vx: 0, vy: 0, r: t.r, tier, age: 0, supported: false };
}

function reset() {
  bodies = [];
  current = roll();
  nextTier = roll();
  score = 0;
  over = false;
  danger = 0;
  cooldown = 0.4;
  combo = 0;
  comboTimer = 0;
  shake = 0;
  drops = 0;
  popups = [];
  sparks = [];
  aimX = (LEFT + RIGHT) / 2;
  scoreEl.textContent = "0";
}

function clampAim(tier) {
  const r = TIERS[tier].r;
  aimX = Math.max(LEFT + r, Math.min(RIGHT - r, aimX));
}

function blocked(x, y, r) {
  return bodies.some((b) => {
    const dx = b.x - x;
    const dy = b.y - y;
    return dx * dx + dy * dy < (b.r + r - 1) * (b.r + r - 1);
  });
}

function beep(freq, dur, gain) {
  if (!audioOn) return;
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur);
  } catch (err) {
    audioOn = false;
  }
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 40 + Math.random() * 180;
    sparks.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 40,
      life: 0.35 + Math.random() * 0.35,
      max: 0.7,
      color,
      r: 1.5 + Math.random() * 2.5,
    });
  }
}

function addScore(n, x, y) {
  score += n;
  scoreEl.textContent = String(score);
  if (score > best) {
    best = score;
    bestEl.textContent = String(best);
    localStorage.setItem(BEST_KEY, String(best));
  }
  popups.push({ x, y, text: "+" + n, life: 0.8 });
}

function drop() {
  if (over || cooldown > 0) return false;
  clampAim(current);
  const r = TIERS[current].r;
  let y = DROP_Y;
  if (blocked(aimX, y, r)) return false;
  bodies.push(make(aimX, y, current));
  current = nextTier;
  nextTier = roll();
  cooldown = 0.28;
  drops += 1;
  beep(180 + current * 30, 0.06, 0.03);
  return true;
}

function collide(a, b) {
  let dx = b.x - a.x;
  let dy = b.y - a.y;
  let dist = Math.hypot(dx, dy) || 0.0001;
  const min = a.r + b.r;
  if (dist >= min) return;
  if (a.tier === b.tier && a.age > 0.05 && b.age > 0.05 && dist < min) {
    return;
  }
  const nx = dx / dist;
  const ny = dy / dist;
  const overlap = min - dist;
  const ma = a.r * a.r;
  const mb = b.r * b.r;
  const inv = 1 / (ma + mb);
  a.x -= nx * overlap * mb * inv;
  a.y -= ny * overlap * mb * inv;
  b.x += nx * overlap * ma * inv;
  b.y += ny * overlap * ma * inv;
  if (ny > 0.45) a.supported = true;
  if (ny < -0.45) b.supported = true;
  const rvx = b.vx - a.vx;
  const rvy = b.vy - a.vy;
  const velN = rvx * nx + rvy * ny;
  if (velN < 0) {
    const j = -(1.05) * velN / (1 / ma + 1 / mb);
    a.vx -= (j * nx) / ma;
    a.vy -= (j * ny) / ma;
    b.vx += (j * nx) / mb;
    b.vy += (j * ny) / mb;
  }
}

function contain(b) {
  if (b.x < LEFT + b.r) {
    b.x = LEFT + b.r;
    if (b.vx < 0) b.vx *= -0.15;
  }
  if (b.x > RIGHT - b.r) {
    b.x = RIGHT - b.r;
    if (b.vx > 0) b.vx *= -0.15;
  }
  if (b.y > BOTTOM - b.r) {
    b.y = BOTTOM - b.r;
    if (b.vy > 0) b.vy *= -0.08;
    b.supported = true;
  }
}

function mergePair(i, j) {
  const a = bodies[i];
  const b = bodies[j];
  const tier = a.tier;
  const ma = a.r * a.r;
  const mb = b.r * b.r;
  const x = (a.x * ma + b.x * mb) / (ma + mb);
  const y = (a.y * ma + b.y * mb) / (ma + mb);
  const vx = (a.vx * ma + b.vx * mb) / (ma + mb);
  const vy = (a.vy * ma + b.vy * mb) / (ma + mb);
  bodies.splice(Math.max(i, j), 1);
  bodies.splice(Math.min(i, j), 1);
  comboTimer = 0.9;
  combo += 1;
  const bonus = combo;
  if (tier >= TIERS.length - 1) {
    const gained = 960 * bonus;
    addScore(gained, x, y);
    burst(x, y, "#fff1c2", 28);
    shake = Math.max(shake, 7);
    beep(880, 0.18, 0.05);
    return;
  }
  const born = make(x, y, tier + 1);
  born.vx = vx * 0.25;
  born.vy = vy * 0.25;
  born.age = 0.08;
  bodies.push(born);
  const gained = TIERS[tier + 1].score * bonus;
  addScore(gained, x, y);
  burst(x, y, TIERS[tier + 1].core, 8 + tier);
  shake = Math.max(shake, tier >= 6 ? 5 : 2);
  beep(240 * Math.pow(2, (tier + 1) / 8), 0.09, 0.04);
}

function mergePass() {
  let guard = 0;
  while (guard++ < 6) {
    let bestI = -1;
    let bestJ = -1;
    let bestOverlap = 0;
    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        const a = bodies[i];
        const b = bodies[j];
        if (a.tier !== b.tier || a.age < 0.05 || b.age < 0.05) continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        const overlap = a.r + b.r + 3 - dist;
        if (overlap > bestOverlap) {
          bestOverlap = overlap;
          bestI = i;
          bestJ = j;
        }
      }
    }
    if (bestI < 0) break;
    mergePair(bestI, bestJ);
  }
}

function tick(dt) {
  if (over) {
    shake *= Math.pow(0.05, dt);
    for (const s of sparks) s.life -= dt;
    sparks = sparks.filter((s) => s.life > 0);
    for (const p of popups) p.life -= dt;
    popups = popups.filter((p) => p.life > 0);
    return;
  }
  cooldown = Math.max(0, cooldown - dt);
  comboTimer = Math.max(0, comboTimer - dt);
  if (comboTimer === 0) combo = 0;
  shake *= Math.pow(0.04, dt);

  const steps = 4;
  const h = dt / steps;
  for (let s = 0; s < steps; s++) {
    for (const b of bodies) {
      b.supported = false;
      b.vy += 2100 * h;
      b.vx *= Math.pow(0.35, h);
      b.x += b.vx * h;
      b.y += b.vy * h;
      b.age += h;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 1400) {
        b.vx *= 1400 / sp;
        b.vy *= 1400 / sp;
      }
      contain(b);
    }
    for (let k = 0; k < 8; k++) {
      for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) collide(bodies[i], bodies[j]);
      }
      for (const b of bodies) contain(b);
    }
    for (const b of bodies) {
      if (b.supported && Math.hypot(b.vx, b.vy) < 28) {
        b.vx = 0;
        b.vy = 0;
      }
    }
  }

  mergePass();

  let hot = false;
  for (const b of bodies) {
    if (b.age > 0.55 && b.y - b.r < LINE_Y) hot = true;
  }
  danger = hot ? danger + dt : 0;
  if (danger > 1.35 && bodies.length > 0) {
    over = true;
    beep(90, 0.3, 0.05);
  }

  for (const s of sparks) {
    s.life -= dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 400 * dt;
  }
  sparks = sparks.filter((s) => s.life > 0);
  for (const p of popups) {
    p.life -= dt;
    p.y -= 28 * dt;
  }
  popups = popups.filter((p) => p.life > 0);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawOrb(x, y, tier) {
  const t = TIERS[tier];
  const g = ctx.createRadialGradient(x - t.r * 0.32, y - t.r * 0.38, t.r * 0.08, x, y, t.r);
  g.addColorStop(0, t.core);
  g.addColorStop(0.45, t.color);
  g.addColorStop(1, "#2a160f");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, t.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,244,230,0.28)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = "rgba(40, 18, 10, 0.78)";
  ctx.font = `700 ${Math.max(12, t.r * 0.42)}px "Microsoft YaHei", sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(t.short, x, y + 1);
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#2a211c");
  bg.addColorStop(1, "#120e0c");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  const jx = (Math.random() - 0.5) * shake;
  const jy = (Math.random() - 0.5) * shake;
  ctx.translate(jx, jy);

  ctx.fillStyle = "#1b140f";
  roundRect(LEFT - 16, 36, RIGHT - LEFT + 32, BOTTOM - 36 + 18, 22);
  ctx.fill();
  ctx.strokeStyle = "#6a4b34";
  ctx.lineWidth = 8;
  ctx.stroke();

  ctx.save();
  roundRect(LEFT, 48, RIGHT - LEFT, BOTTOM - 48, 8);
  ctx.clip();
  ctx.fillStyle = "#241910";
  ctx.fillRect(LEFT, 48, RIGHT - LEFT, BOTTOM - 48);

  for (const b of bodies) drawOrb(b.x, b.y, b.tier);

  if (!over) {
    clampAim(current);
    ctx.globalAlpha = cooldown > 0 ? 0.45 : 0.95;
    drawOrb(aimX, DROP_Y, current);
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = "#e7d3b0";
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.moveTo(aimX, DROP_Y + TIERS[current].r + 6);
    ctx.lineTo(aimX, BOTTOM - 8);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  for (const s of sparks) {
    ctx.globalAlpha = Math.max(0, s.life / s.max);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, p.life / 0.8);
    ctx.fillStyle = "#fff6e4";
    ctx.font = "700 18px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  const heat = Math.min(1, danger / 1.35);
  ctx.strokeStyle = `rgba(255, 90, 70, ${0.45 + heat * 0.55})`;
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(LEFT + 8, LINE_Y);
  ctx.lineTo(RIGHT - 8, LINE_Y);
  ctx.stroke();
  ctx.setLineDash([]);
  if (heat > 0) {
    ctx.fillStyle = `rgba(255, 120, 96, ${heat})`;
    ctx.font = "600 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("要漫过井口了", (LEFT + RIGHT) / 2, LINE_Y - 10);
  }

  ctx.restore();
  ctx.restore();

  const preview = TIERS[nextTier];
  ctx.fillStyle = "#2a211c";
  roundRect(18, 18, 132, 58, 12);
  ctx.fill();
  ctx.fillStyle = "#b5a89a";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("下一个", 30, 38);
  ctx.fillStyle = "#f3eadf";
  ctx.font = "600 16px sans-serif";
  ctx.fillText(preview.name, 30, 60);
  ctx.save();
  ctx.translate(124, 48);
  ctx.scale(0.42, 0.42);
  drawOrb(0, 0, nextTier);
  ctx.restore();

  if (combo > 1 && !over) {
    ctx.fillStyle = "#ffd27a";
    ctx.font = "700 16px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(combo + " 连", RIGHT - 8, 70);
  }

  if (drops === 0 && !over) {
    ctx.fillStyle = "rgba(243, 234, 223, 0.8)";
    ctx.font = "600 16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("点一下，把火种投进井里", (LEFT + RIGHT) / 2, 230);
  }

  if (over) {
    ctx.fillStyle = "rgba(12, 8, 6, 0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#f3eadf";
    ctx.textAlign = "center";
    ctx.font = "700 36px sans-serif";
    ctx.fillText("井灭了", W / 2, H / 2 - 36);
    ctx.font = "18px sans-serif";
    ctx.fillStyle = "#e7d3b0";
    ctx.fillText("这一井 " + score + " 分", W / 2, H / 2 + 4);
    ctx.fillText("点击或按 R 再开一井", W / 2, H / 2 + 36);
  }
}

function pointerMove(clientX) {
  const rect = canvas.getBoundingClientRect();
  pointerX = ((clientX - rect.left) / rect.width) * W;
  aimX = pointerX;
}

canvas.addEventListener("pointermove", (e) => pointerMove(e.clientX));
canvas.addEventListener("pointerdown", (e) => {
  pointerMove(e.clientX);
  if (over) reset();
  else drop();
});

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") aimX -= 18;
  if (e.key === "ArrowRight") aimX += 18;
  if (e.key === " " || e.key === "Spacebar") {
    e.preventDefault();
    if (over) reset();
    else drop();
  }
  if (e.key === "r" || e.key === "R") reset();
});

document.getElementById("mute").addEventListener("click", () => {
  audioOn = !audioOn;
  document.getElementById("mute").textContent = audioOn ? "声音开" : "声音关";
});

function frame(t) {
  const dt = Math.min(0.033, last ? (t - last) / 1000 : 0.016);
  last = t;
  tick(dt);
  render();
  requestAnimationFrame(frame);
}

resize();
window.addEventListener("resize", resize);
reset();

const sim = new URLSearchParams(location.search).has("sim");
if (sim) {
  let nan = false;
  let merges = 0;
  const before = score;
  for (let n = 0; n < 240; n++) {
    if (over) reset();
    aimX = LEFT + 30 + Math.random() * (RIGHT - LEFT - 60);
    const s0 = score;
    drop();
    for (let k = 0; k < 18; k++) tick(1 / 60);
    if (score > s0) merges += 1;
    for (const b of bodies) {
      if (!Number.isFinite(b.x) || !Number.isFinite(b.y) || !Number.isFinite(b.vx)) nan = true;
      if (b.x < -20 || b.x > W + 20 || b.y > H + 40) nan = true;
    }
  }
  simEl.style.display = "block";
  simEl.textContent = (nan ? "NAN" : "OK") + " score=" + score + " bodies=" + bodies.length + " merges=" + merges + " start=" + before;
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
